[package]
name = "semquery-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Model registry, download cache, and local inference backends for semquery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/semquery"
readme = "../../README.md"
keywords = ["rag", "embeddings", "llm", "gguf", "onnx"]
categories = ["algorithms", "science"]

[features]
default = ["embed", "rerank", "llm"]
embed = ["dep:fastembed"]
rerank = ["dep:fastembed"]
llm = ["dep:llama-cpp-2"]

[dependencies]
semquery-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
hf-hub = { workspace = true }
fastembed = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }
encoding_rs = { workspace = true }
log = { workspace = true }

[dev-dependencies]
semquery-storage = { workspace = true }
tempfile = { workspace = true }
