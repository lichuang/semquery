[package]
name = "semquery-retrieve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hybrid retrieval pipeline for semquery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/semquery"
readme = "../../README.md"
keywords = ["rag", "retrieval", "bm25", "search"]
categories = ["algorithms", "text-processing"]

[dependencies]
semquery-core = { workspace = true }
semquery-model = { workspace = true, features = ["rerank"] }
semquery-storage = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
semquery-indexer = { workspace = true }
tempfile = { workspace = true }
