[package]
name = "semquery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for local-first search and answers over your documents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/semquery"
readme = "../../README.md"
keywords = ["cli", "rag", "search", "local"]
categories = ["command-line-utilities"]

[dependencies]
semquery-core = { workspace = true }
semquery-model = { workspace = true }
semquery-indexer = { workspace = true }
semquery-storage = { workspace = true }
semquery-retrieve = { workspace = true }
semquery-synth = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
tokenizers = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
flexi_logger = { workspace = true }
tokio-stream = { workspace = true }

[features]
default = ["pdf", "docx"]
pdf = ["semquery-indexer/pdf"]
docx = ["semquery-indexer/docx"]

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "semquery"
path = "src/lib.rs"

[[bin]]
name = "semq"
path = "src/main.rs"
