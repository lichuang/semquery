[package]
name = "semquery-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Document reading, chunking, and incremental indexing for semquery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lichuang/semquery"
readme = "../../README.md"
keywords = ["rag", "indexing", "chunking", "search"]
categories = ["algorithms", "text-processing"]

[dependencies]
semquery-core = { workspace = true }
semquery-model = { workspace = true, features = ["embed"] }
semquery-storage = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
jieba-rs = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
tokio-stream = { workspace = true }
pdf-extract = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

[features]
default = ["pdf", "docx"]
pdf = ["dep:pdf-extract"]
docx = ["dep:zip", "dep:quick-xml"]

[dev-dependencies]
tempfile = { workspace = true }
lopdf = { workspace = true }
zip = { workspace = true }
